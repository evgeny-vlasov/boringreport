name: Render Boring Report issue

on:
  push:
    paths:
      - "data/issues/**"
  pull_request:
    paths:
      - ".github/workflows/render-issue.yml"
      - "scripts/**"
      - "data/issues/2026-09-01/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue directory date (YYYY-MM-DD)"
        required: true
        type: string

concurrency:
  group: boring-report-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      issue: ${{ steps.issue.outputs.issue }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.2.2"
          use-public-rspm: true

      - name: Identify issue package
        id: issue
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ISSUE: ${{ inputs.issue }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            issues=("2026-09-01")
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            issues=("$INPUT_ISSUE")
          else
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              mapfile -t changed_files < <(git show --format= --name-only "$AFTER_SHA")
            else
              mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
            fi

            mapfile -t issues < <(
              printf '%s\n' "${changed_files[@]}" |
                awk -F/ '$1 == "data" && $2 == "issues" && NF >= 4 { print $3 }' |
                sort -u
            )
          fi

          if [[ "${#issues[@]}" -eq 0 ]]; then
            echo "No changed data/issues/YYYY-MM-DD package was found." >&2
            exit 1
          fi
          if [[ "${#issues[@]}" -gt 1 ]]; then
            echo "V1 supports exactly one changed issue package per push; found:" >&2
            printf '  %s\n' "${issues[@]}" >&2
            exit 1
          fi

          issue="${issues[0]}"
          if [[ ! "$issue" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Issue must have YYYY-MM-DD form; received: $issue" >&2
            exit 1
          fi

          issue_dir="data/issues/$issue"
          if [[ ! -d "$issue_dir" ]]; then
            echo "Issue directory does not exist: $issue_dir" >&2
            exit 1
          fi

          required=(issue.json report-en.html report-ru.html telegram-ru.html)
          for file in "${required[@]}"; do
            if [[ ! -s "$issue_dir/$file" ]]; then
              echo "Required issue-package file is absent or empty: $issue_dir/$file" >&2
              exit 1
            fi
          done

          echo "Issue package: $issue"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2@4.0.3
            any::sf@1.1.2
            any::rnaturalearth@1.2.0
            any::rnaturalearthdata@1.0.0
            any::dplyr@1.2.1
            any::jsonlite@2.0.0
            any::ggrepel@0.9.8
            any::patchwork@1.3.2
            any::svglite@2.2.2
            any::ragg@1.5.2
            any::stringr@1.6.0
            any::systemfonts@1.3.2
            any::textshaping@1.0.5
          dependencies: '"hard"'
          upgrade: "FALSE"
          cache: true
          install-pandoc: false
          install-quarto: false

      - name: Verify rendering environment
        shell: Rscript {0}
        run: |
          if (!identical(paste(R.version$major, R.version$minor, sep = "."),
                         "4.2.2")) {
            stop("R version does not match the pinned CI version: ", R.version.string)
          }
          expected <- c(
            ggplot2 = "4.0.3",
            sf = "1.1.2",
            rnaturalearth = "1.2.0",
            rnaturalearthdata = "1.0.0",
            dplyr = "1.2.1",
            jsonlite = "2.0.0",
            ggrepel = "0.9.8",
            patchwork = "1.3.2",
            svglite = "2.2.2",
            ragg = "1.5.2",
            stringr = "1.6.0",
            systemfonts = "1.3.2",
            textshaping = "1.0.5"
          )
          actual <- vapply(names(expected), function(pkg) {
            as.character(utils::packageVersion(pkg))
          }, character(1))
          print(actual)
          if (!identical(unname(actual), unname(expected))) {
            stop("Installed R package versions do not match the canonical V1 versions.")
          }

          font <- systemfonts::match_fonts("DejaVu Sans")
          if (nrow(font) != 1L || !nzchar(font$path[[1]]) ||
              !file.exists(font$path[[1]])) {
            stop("DejaVu Sans is required for stable Latin and Cyrillic rendering.")
          }
          glyphs <- systemfonts::glyph_info(
            c("A", "Б", "я"),
            path = font$path[[1]],
            index = font$index[[1]]
          )
          if (any(glyphs$index == 0L)) {
            stop("DejaVu Sans does not provide the required Latin/Cyrillic glyphs.")
          }
          print(R.version.string)
          print(sf::sf_extSoftVersion())
          print(font)

      - name: Validate issue
        env:
          ISSUE: ${{ steps.issue.outputs.issue }}
        run: Rscript scripts/validate_issue.R "data/issues/$ISSUE/issue.json"

      - name: Render issue
        env:
          ISSUE: ${{ steps.issue.outputs.issue }}
        run: Rscript scripts/render_report.R "data/issues/$ISSUE/issue.json" "output/$ISSUE/"

      - name: Verify generated outputs
        shell: Rscript {0}
        env:
          ISSUE: ${{ steps.issue.outputs.issue }}
        run: |
          issue <- Sys.getenv("ISSUE")
          output_dir <- file.path("output", issue)
          files <- file.path(output_dir, c(
            "boring-report-en.svg",
            "boring-report-en.png",
            "boring-report-ru.svg",
            "boring-report-ru.png"
          ))

          missing <- files[!file.exists(files)]
          if (length(missing)) {
            stop("Missing output files: ", paste(missing, collapse = ", "))
          }
          empty <- files[file.info(files)$size <= 0]
          if (length(empty)) {
            stop("Empty output files: ", paste(empty, collapse = ", "))
          }

          png_dimensions <- function(path) {
            con <- file(path, "rb")
            on.exit(close(con))
            signature <- readBin(con, "raw", n = 8)
            expected_signature <- as.raw(c(137, 80, 78, 71, 13, 10, 26, 10))
            if (!identical(signature, expected_signature)) {
              stop("Invalid PNG signature: ", path)
            }
            chunk_length <- readBin(con, integer(), n = 1, size = 4, endian = "big")
            chunk_type <- rawToChar(readBin(con, "raw", n = 4))
            if (chunk_length != 13L || chunk_type != "IHDR") {
              stop("Invalid PNG IHDR chunk: ", path)
            }
            c(
              width = readBin(con, integer(), n = 1, size = 4, endian = "big"),
              height = readBin(con, integer(), n = 1, size = 4, endian = "big")
            )
          }

          for (path in files[grepl("[.]png$", files)]) {
            dimensions <- png_dimensions(path)
            if (!identical(unname(dimensions), c(2400L, 1350L))) {
              stop(path, " is ", paste(dimensions, collapse = " x "),
                   "; expected 2400 x 1350.")
            }
            message(path, ": 2400 x 1350")
          }

          for (path in files[grepl("[.]svg$", files)]) {
            document <- paste(readLines(path, warn = FALSE, encoding = "UTF-8"),
                              collapse = "\n")
            if (!grepl("<svg(?:[[:space:]>])", document, perl = TRUE) ||
                !grepl("</svg>", document, fixed = TRUE)) {
              stop("Invalid SVG document: ", path)
            }
            message(path, ": valid non-empty SVG")
          }

      - name: Upload issue artifact
        uses: actions/upload-artifact@v4
        with:
          name: boring-report-${{ steps.issue.outputs.issue }}
          if-no-files-found: error
          path: |
            data/issues/${{ steps.issue.outputs.issue }}/issue.json
            data/issues/${{ steps.issue.outputs.issue }}/report-en.html
            data/issues/${{ steps.issue.outputs.issue }}/report-ru.html
            data/issues/${{ steps.issue.outputs.issue }}/telegram-ru.html
            output/${{ steps.issue.outputs.issue }}/boring-report-en.png
            output/${{ steps.issue.outputs.issue }}/boring-report-ru.png
            output/${{ steps.issue.outputs.issue }}/boring-report-en.svg
            output/${{ steps.issue.outputs.issue }}/boring-report-ru.svg

      - name: Log canonical V1 hashes
        if: steps.issue.outputs.issue == '2026-09-01'
        run: |
          set -euo pipefail
          echo "Canonical byte hashes are diagnostic only; harmless cross-platform typography differences are expected."
          files=(
            output/2026-09-01/boring-report-en.svg
            output/2026-09-01/boring-report-en.png
            output/2026-09-01/boring-report-ru.svg
            output/2026-09-01/boring-report-ru.png
          )
          for file in "${files[@]}"; do
            git cat-file -e "HEAD:$file"
            expected="$(git show "HEAD:$file" | sha256sum | awk '{ print $1 }')"
            actual="$(sha256sum "$file" | awk '{ print $1 }')"
            result="IDENTICAL"
            if [[ "$expected" != "$actual" ]]; then
              result="DIFFERENT"
            fi
            printf '%s\n  committed: %s\n  rendered:  %s\n  result:    %s\n' \
              "$file" "$expected" "$actual" "$result"
          done

  commit-output:
    if: github.event_name == 'push'
    needs: render
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download rendered issue artifact
        uses: actions/download-artifact@v4
        with:
          name: boring-report-${{ needs.render.outputs.issue }}
          path: rendered-package

      - name: Commit generated outputs
        env:
          ISSUE: ${{ needs.render.outputs.issue }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          outputs=(
            "output/$ISSUE/boring-report-en.svg"
            "output/$ISSUE/boring-report-en.png"
            "output/$ISSUE/boring-report-ru.svg"
            "output/$ISSUE/boring-report-ru.png"
          )
          mkdir -p "output/$ISSUE"
          for output in "${outputs[@]}"; do
            source="rendered-package/$output"
            if [[ ! -s "$source" ]]; then
              echo "Rendered artifact file is absent or empty: $source" >&2
              exit 1
            fi
            cp -- "$source" "$output"
          done
          git add -- "${outputs[@]}"
          if git diff --cached --quiet; then
            echo "Generated outputs are unchanged; no commit is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: render Boring Report $ISSUE" -- "${outputs[@]}"
          git push origin "HEAD:$BRANCH"
